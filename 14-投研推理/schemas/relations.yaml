machine_validation_rules:
  - id: relation_endpoints_must_exist
    description: 每个关系的 source_types 和 target_types 必须引用 objects.yaml 中存在的对象类型。
  - id: relation_properties_have_required_flags
    description: 每个关系属性必须声明 required。
  - id: signal_role_relation_compatibility
    description: Signal.signalRole 必须与该信号建立的效果关系匹配；catalyst 不得直接 supportsHypothesis，blocking 不得作用于 JudgmentOutput。
  - id: source_document_is_not_sufficient_when_ai_summary
    description: sourceForm=ai_summary 的 SourceDocument 不得作为正式入库对象的唯一 sourceOf 来源。
